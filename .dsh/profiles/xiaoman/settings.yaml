# 小满（xiaoman profile）专属 settings 文档 —— 有意留空 {}。
#
# 为什么需要它：
#   全局 ~/.dsh/settings.yaml 的 `agent-default-model` 段属于 settings「用户层」，
#   而解析顺序是 schema 默认 → 组合层(base) → settings 用户层，用户层会盖掉组合层。
#   本文件由 cordis.patch.yml 的 `settings` 行指向，把全局文档挡在外面，
#   让小满能独立于全局默认模型（以及 Web「模型」页写入的选择）。
#
# 小满的模型与 provider 路由定义都在 cordis.patch.yml 的「模型路由」段（组合层），
# 不在本文件。
#
# 注意：空文件（只有注释）会被解析成 null，可能被判为无效文档；保留下面的 {} 空 map。
{}
