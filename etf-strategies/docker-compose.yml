# ===================================
# AStock ETF Dashboard — Docker Compose
# ===================================
#
# 启动:
#   docker compose up -d
#
# 查看日志（含首次启动的 admin 密码）:
#   docker compose logs -f
#
# 停止:
#   docker compose down
#
# 完全重置（删除数据卷）:
#   docker compose down -v

name: etf-dashboard
version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etf-dashboard
    restart: unless-stopped

    ports:
      - "${DASHBOARD_PORT:-8000}:8000"

    # 环境变量（可选覆盖）
    environment:
      - TZ=Asia/Shanghai
      # 首次启动时预设 admin 密码（不设则自动生成，查看日志获取）
      # - DASHBOARD_ADMIN_PASSWORD=your-secure-password
      # JWT 签名密钥（不设则自动生成并持久化到 data/.secret_key）
      # - DASHBOARD_SECRET_KEY=your-secret-key

    # 持久化数据卷
    volumes:
      - dashboard_data:/app/dashboard/data   # SQLite DB + .secret_key
      - dashboard_cache:/app/cache           # K线 parquet 缓存
      - dashboard_report:/app/report         # 回测 HTML 报告

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  dashboard_data:
  dashboard_cache:
  dashboard_report:
