# ===================================
# AStock ETF Dashboard — Docker Compose
# ===================================
#
# 启动:
#   cp .env.example .env   # 填入 ANTHROPIC_AUTH_TOKEN（见下）
#   docker compose up -d
#
# 查看日志（含首次启动的 admin 密码）:
#   docker compose logs -f
#
# 停止:
#   docker compose down
#
# 完全重置（删除数据卷）:
#   docker compose down -v
#
# 每日复盘定时任务说明:
#   - 容器内已装 Claude Code CLI，调度器用 `claude -p` 执行 my_doc/每日复盘/ 的 prompt
#   - 认证走环境变量 ANTHROPIC_AUTH_TOKEN + ANTHROPIC_BASE_URL（火山方舟 ARK），
#     从 .env 读取（模板见 .env.example，值来自宿主 ~/.claude/settings.json 的 env 块）
#   - 仓库根通过 `../` 挂载到 /repo（DASHBOARD_REPO_ROOT），claude 子进程以 /repo
#     为工作目录读写 prompt/报告/持仓/交易日历——与本地运行共用同一份文件
#   - DASHBOARD_SCHEDULER_ENABLED=1 打开 auto 调度；若你同时在宿主跑 /loop 驱动
#     同一批任务，请改回 0（防双跑）

name: etf-dashboard

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etf-dashboard
    restart: unless-stopped

    ports:
      - "${DASHBOARD_PORT:-8000}:8000"

    # 环境变量（可选覆盖）
    environment:
      - TZ=Asia/Shanghai
      # 每日复盘调度器：仓库根挂载点 + auto 调度开关
      - DASHBOARD_REPO_ROOT=/repo
      - DASHBOARD_SCHEDULER_ENABLED=${DASHBOARD_SCHEDULER_ENABLED:-1}
      # claude -p 认证（方舟 ARK，必须从 .env 提供令牌，否则 compose 启动即报错）
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:?请在 etf-strategies/.env 中设置 ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://ark.cn-beijing.volces.com/api/plan}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-deepseek-v4-flash-ga-260731}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL:-deepseek-v4-pro[1m]}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL:-deepseek-v4-flash[1m]}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL:-deepseek-v4-flash[1m]}
      - API_TIMEOUT_MS=${API_TIMEOUT_MS:-3000000}
      - CLAUDE_CODE_SUBAGENT_MODEL=${CLAUDE_CODE_SUBAGENT_MODEL:-deepseek-v4-flash[1m]}
      # 严格零本地（可选）：DB_MODE=memory + CLOUD_RESTORE_ON_START=1
      - DB_MODE=${DB_MODE:-}
      - CLOUD_RESTORE_ON_START=${CLOUD_RESTORE_ON_START:-}
      # 首次启动时预设 admin 密码（不设则自动生成，查看日志获取）
      # - DASHBOARD_ADMIN_PASSWORD=your-secure-password
      # JWT 签名密钥（不设则自动生成并持久化到 data/.secret_key）
      # - DASHBOARD_SECRET_KEY=your-secret-key

    # 持久化数据卷
    volumes:
      - dashboard_data:/app/dashboard/data   # SQLite DB + .secret_key
      - dashboard_cache:/app/cache           # K线 parquet 缓存
      - dashboard_report:/app/report         # 回测 HTML 报告
      - dashboard_agent:/app/agent/data      # 拟人 Agent「小满」数据（与 agent 服务共享）
      - ../:/repo                            # 仓库根（每日复盘 prompt/报告/持仓/交易日历）

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 资源限制（claude -p 子进程 + python 取数峰值可能 >1G，2G 更稳）
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  # ── OpenViking 记忆服务（官方镜像；本机为主时可不启动此服务）──
  openviking:
    image: ghcr.io/volcengine/openviking:latest
    container_name: etf-openviking
    restart: unless-stopped
    ports:
      - "${OPENVIKING_PORT:-1933}:1933"
    volumes:
      - ~/.openviking:/app/.openviking   # ov.conf + data（机器特定，不入仓库）
    environment:
      - OPENVIKING_SERVER_PORT=1933

  # ── 拟人 Agent「小满」常驻进程（独立于 dashboard，崩溃互不影响）──
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etf-agent
    restart: unless-stopped
    # 启动前把仓库 .dsh/profiles 同步到容器内 dsh（幂等，不覆盖已存在），再起 agent
    command: ["sh", "-c",
              "mkdir -p /root/.dsh/profiles && cp -rn /repo/.dsh/profiles/* /root/.dsh/profiles/ 2>/dev/null || true; exec python -m agent"]

    environment:
      - TZ=Asia/Shanghai
      # 小满的 LLM 凭据：容器内 dsh 使用（本地跑则用 ~/.dsh/.credentials.yaml，key 单点）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # dsh 工作目录（与 dashboard 一致；dsh_runner 的 REPO_ROOT）
      - DASHBOARD_REPO_ROOT=/repo
      # 严格零本地（可选）：SQLite 内存化 + 启动从 TOS 恢复
      - DB_MODE=${DB_MODE:-}
      - CLOUD_RESTORE_ON_START=${CLOUD_RESTORE_ON_START:-}

    volumes:
      - dashboard_agent:/app/agent/data      # agent.db（与 dashboard 服务共享）
      - ../:/repo                            # 仓库根（备用素材源）

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  dashboard_data:
  dashboard_cache:
  dashboard_report:
  dashboard_agent:
