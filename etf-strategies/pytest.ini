[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -p no:langsmith.pytest_plugin
    -v
    --strict-markers
    --tb=short

markers =
    network: 需要真实网络访问的测试（东财API等）
    slow: 运行缓慢的测试 (>1s)
    strategy: 策略相关测试
    engine: 回测引擎相关测试
    data: 数据层相关测试
    metrics: 指标计算相关测试

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 覆盖率配置（使用 --cov=backtest 时生效）
[coverage:run]
source = backtest
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
