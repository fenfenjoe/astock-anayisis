logic_prose: "# 克隆自聚宽文章：https://www.joinquant.com/post/61155\n# 标题：ETF轮动+择时策略\n# 作者：mackintosh\n\n# ETF策略最终版 - 聚宽平台专用\n# 修复所有API调用问题，确保能够正常交易\n\n# 聚宽平台API导入 - 这是关键！\nfrom jqdata import *\nimport numpy as np\nimport pandas as pd\nimport math\n\n# ===============================================================================\n# 策略配置\n# ===============================================================================\n\n# ETF池\nETF_POOL = [\n    '518880.XSHG',  # 黄金ETF\n    '513100.XSHG',  # 纳指100\n    '159915.XSHE',  # 创业板100\n    '510180.XSHG',  # 上证180\n]\n\nTIMING_ETF = '510300.XSHG'  # 沪深300ETF\n\n# 策略参数\nROTATION_WEIGHT = 0.6    # ETF轮动权重\nTIMING_WEIGHT = 0.4      # 择时权重\n\n# ===============================================================================\n# 简化技术指标\n# ===============================================================================\n\ndef simple_momentum(prices, period=20):\n    \"\"\"简单动量计算\"\"\"\n    if len(prices) &lt;  period:\n        return 0\n    \n    recent_prices = prices[-period:]\n    return (recent_prices[-1] / recent_prices[0] - 1) * 100\n\ndef simple_rsrs(high_prices, low_prices, period=15):\n    \"\"\"简化RSRS计算\"\"\"\n    if len(high_prices) &lt;  period or len(low_prices) &lt;  period:\n        return 1.0  # 默认买入信号\n    \n    try:\n        highs = high_prices[-period:]\n        lows = low_prices[-period:]\n        slope = np.polyfit(lows, highs, 1)[0]\n        return slope if not np.isnan(slope) else 1.0\n    except:\n        return 1.0\n\n# ===============================================================================\n# 聚宽主函数\n# ===============================================================================\n\ndef initialize(context):\n    \"\"\"初始化\"\"\"\n    log.info('=== ETF策略最终版启动 ===')\n    \n    # 基本设置\n    set_benchmark('000300.XSHG')\n    set_option('use_real_price', True)\n    \n    # 交易成本\n    set_order_cost(OrderCost(\n        open_tax=0,\n        close_tax=0.001,\n        open_commission=0.0003,\n        close_commission=0.0003,\n        min_commission=5\n    ), type='stock')\n    \n    # 全局变量\n    g.day_count = 0\n    g.last_trade_day = None\n    g.trade_count = 0\n    g.force_trade = True  # 强制交易标志\n    \n    # 设置运行\n    run_daily(daily_trade, time='09:30')\n    run_daily(daily_report, time='15:00')\n    \n    log.info('初始化完成')\n\ndef daily_trade(context):\n    \"\"\"每日交易逻辑\"\"\"\n    g.day_count += 1\n    current_date = context.current_dt.date()\n    \n    log.info(f'=== 第{g.day_count}天 {current_date} ===')\n    \n    try:\n        # 前5天强制建仓，确保有交易\n        if g.day_count &lt; = 5 or g.force_trade:\n            force_initial_position(context)\n            g.force_trade = False\n            return\n        \n        # 之后每3天调仓一次\n        if g.last_trade_day is None or (current_date - g.last_trade_day).days &gt;= 3:\n            execute_simple_strategy(context)\n            g.last_trade_day = current_date\n        \n        # 检查持仓\n        check_positions(context)\n        \n    except Exception as e:\n        log.error(f'交易执行出错: {str(e)}')\n        import traceback\n        log.error(traceback.format_exc())\n\ndef force_initial_position(context):\n    \"\"\"强制初始建仓 - 使用正确的聚宽API\"\"\"\n    try:\n        log.info('执行强制建仓')\n        \n        # 计算买入金额\n        total_value = context.portfolio.total_value\n        etf_value = total_value * ROTATION_WEIGHT\n        timing_value = total_value * TIMING_WEIGHT\n        \n        # 第一天买入第一个ETF\n        if g.day_count == 1:\n            order_target_value(ETF_POOL[0], etf_value)\n            log.info(f'强制买入ETF: {ETF_POOL[0]} {etf_value:.0f}元 ({ROTATION_WEIGHT:.1%})')\n            g.trade_count += 1\n            \n            order_target_value(TIMING_ETF, timing_value)\n            log.info(f'强制买入择时: {TIMING_ETF} {timing_value:.0f}元 ({TIMING_WEIGHT:.1%})')\n            g.trade_count += 1\n        \n        # 后续几天轮流买入不同ETF\n        else:\n            etf_index = (g.day_count - 2) % len(ETF_POOL)\n            target_etf = ETF_POOL[etf_index]\n            \n            # 卖出其他ETF\n            for etf in ETF_POOL:\n                if etf != target_etf:\n                    order_target_value(etf, 0)\n                    \n           "
